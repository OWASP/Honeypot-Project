worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    
    # DoS Protection: Limit to 10 requests per second per IP
    limit_req_zone $binary_remote_addr zone=honeypot_limit:10m rate=10r/s;

    server {
        listen 80;
        server_name localhost;

        # ==========================================
        # CLIENT IDENTITY (real_ip module) - DO NOT TRUST 0.0.0.0/0
        # ==========================================
        # The sensor is exposed directly on :80 (see main.tf / docker-compose.yml),
        # so $remote_addr is already the real attacker IP. X-Forwarded-For is
        # attacker-controlled and must never decide identity, rate limiting,
        # the persona session or telemetry (see OWASP/Honeypot-Project#111).
        #
        # If a load balancer is ever placed in front of this Nginx, trust ONLY
        # the LB subnet and walk the chain, e.g.:
        #   set_real_ip_from  10.0.0.0/16;
        #   real_ip_header    X-Forwarded-For;
        #   real_ip_recursive on;

        location / {
            limit_req zone=honeypot_limit burst=20 nodelay;

            # ==========================================
            # 1. ROUTE TO THE PYTHON BRAIN
            # ==========================================
            # Nginx passes all traffic to the Stimulus Engine first
            proxy_pass http://engine:5000;
            
            # ==========================================
            # 2. PRESERVE ATTACKER IDENTITY
            # ==========================================
            # Crucial for the Python Engine to read the real IP and User-Agent
            proxy_set_header Host $host;
            # Overwrite (never append) so client-supplied values cannot leak
            # downstream as identity. The claimed XFF is kept for research only.
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Client-Claimed-XFF $http_x_forwarded_for;
            proxy_set_header User-Agent $http_user_agent;

            # ==========================================
            # 3. HEADER SPOOFING
            # ==========================================
            # Disguise the proxy to look like a standard web server
            proxy_hide_header Server;
            proxy_hide_header X-Powered-By;
            # add_header Server "nginx/1.24.0" always;
            # add_header X-Powered-By "PHP/8.2" always;
        }
    }
}
