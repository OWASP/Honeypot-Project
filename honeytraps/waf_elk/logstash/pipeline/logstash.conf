# Logstash pipeline for the honeytraps/waf_elk stack.
# Same filter logic as mds_elk. The codec => json that was previously on the
# beats input is removed here and replaced with an explicit json filter so
# both pipelines behave consistently.

input {
  beats {
    port => 5044
    type => "mod_security"
  }
}

filter {
  json {
    source => "message"
    target => "modsec"
    remove_field => ["message"]
  }

  if [modsec][transaction] {
    mutate {
      add_field => {
        "event_type"                    => "attack"
        "[event_envelope][version]"     => "1.1"
        "[event_envelope][node_id]"     => "${HONEYPOT_NODE_ID:honeypot-node-local}"
        "[event_envelope][honeypot_ip]" => "${HONEYPOT_IP:0.0.0.0}"
        "[event_envelope][aws_region]"  => "${AWS_REGION:local}"
      }
    }

    mutate {
      copy => { "[modsec][transaction][time]" => "[event_envelope][timestamp]" }
    }

    mutate {
      add_field => {
        "[persona_context][name]"    => "${HONEYPOT_PERSONA:unknown}"
        "[persona_context][profile]" => "${HONEYPOT_PROFILE:general}"
      }
    }

  geoip {
    source =>	"[modsec][transaction][remote_address]"
    target => "[geoip2]"
    fields => ["country_code2", "city_name", "latitude", "longitude"]
  }
  mutate {
    rename => {
      "[geoip2][country_code2]" => "[geoip2][country]"
      "[geoip2][city_name]"     => "[geoip2][city]"
    }
  }
  # --- ASN/ISP enrichment start ---
  # ASN/ISP enrichment using the GeoLite2-ASN database.
  # Check if the database was downloaded during the Docker build.
  ruby {
    code => '
      if File.exist?("/usr/share/logstash/GeoLite2-ASN.mmdb")
        event.set("[@metadata][asn_db_available]", true)
      end
    '
  }

  if [@metadata][asn_db_available] {
    geoip {
      source   => "[modsec][transaction][remote_address]"
      target   => "[geoip2]"
      database => "/usr/share/logstash/GeoLite2-ASN.mmdb"
      fields   => ["autonomous_system_number", "autonomous_system_organization"]
      tag_on_failure => ["_asn_lookup_failure"]
    }
    mutate {
      rename => {
        "[geoip2][autonomous_system_number]"       => "[geoip2][asn]"
        "[geoip2][autonomous_system_organization]" => "[geoip2][isp]"
      }
    }
  }
  # --- ASN/ISP enrichment end ---


  mutate {
    copy => {
      "[modsec][transaction][transaction_id]" => "[transaction][transaction_id]"
      "[modsec][transaction][time]"           => "[transaction][time]"
      "[modsec][transaction][remote_address]" => "[transaction][remote_address]"
      "[modsec][transaction][remote_port]"    => "[transaction][remote_port]"
      "[modsec][transaction][local_address]"  => "[transaction][local_address]"
      "[modsec][transaction][local_port]"     => "[transaction][local_port]"
      "[modsec][request][request_line]"       => "[request][request_line]"
      "[modsec][request][headers]"            => "[request][headers]"
      "[modsec][response][protocol]"          => "[response][protocol]"
      "[modsec][response][status]"            => "[response][status]"
      "[modsec][response][headers]"           => "[response][headers]"
    }
  }

  ruby {
    code => '
      messages = event.get("[modsec][audit_data][messages]")
      if messages && messages.is_a?(Array) && messages.length > 0
        # modsecurity severity scale ordered most severe first, so a lower
        # index outranks a higher one.
        severity_scale = ["EMERGENCY", "ALERT", "CRITICAL", "ERROR", "WARNING", "NOTICE", "INFO", "DEBUG"]
        critical_rank = severity_scale.index("CRITICAL")
        severity_best = severity_scale.length

        # one request trips rules from several crs categories at once. the 942
        # sqli family in particular carries many warning-level generic quote
        # and metacharacter patterns that also match xss, traversal and rce
        # payloads, so classifying from whichever rule matched last (or first)
        # mislabels the attack. tally hits per category instead and prefer the
        # category with the most high-confidence (critical or worse) matches.
        category_hits = {}
        category_strong = {}
        category_tactics = {}
        category_order = []

        severity = "UNKNOWN"
        rule_id = ""
        attack_type = "UNKNOWN"
        cve = nil
        mitre = []

        messages.each do |msg|
          msg_rank = severity_scale.length
          if msg =~ /\[severity "([^"]+)"\]/
            found_severity = $1.to_s
            msg_rank = severity_scale.index(found_severity.upcase) || severity_scale.length
            if msg_rank < severity_best
              severity_best = msg_rank
              severity = found_severity
            end
          end
          if msg =~ /\[id "([^"]+)"\]/ && rule_id == ""
            rule_id = $1.to_s
          end
          if msg =~ /\[tag "(CVE-[^"]+)"\]/ && cve.nil?
            cve = $1.to_s
          end
          if msg =~ /\[file "([^"]+)"\]/
            rule_file = $1.to_s
            category = nil
            tactics = []
            if rule_file.include?("XSS")
              category = "XSS"
              tactics = ["T1059.007"]
            elsif rule_file.include?("SQL")
              category = "SQLi"
              tactics = ["T1190"]
            elsif rule_file.include?("LFI") || rule_file.include?("RFI")
              category = "LFI/RFI"
              tactics = ["T1083"]
            elsif rule_file.include?("-RCE") || rule_file.include?("COMMAND")
              category = "RCE"
              tactics = ["T1059"]
            elsif rule_file.include?("SCANNER")
              category = "Scanner"
              tactics = ["T1595"]
            elsif rule_file.include?("TRAVERSAL")
              category = "Path Traversal"
              tactics = ["T1083", "T1190"]
            end
            if category
              category_hits[category] = (category_hits[category] || 0) + 1
              category_strong[category] = (category_strong[category] || 0) + (msg_rank <= critical_rank ? 1 : 0)
              category_tactics[category] = tactics
              category_order << category unless category_order.include?(category)
            end
          end
          # never break early: a cve tag, a more severe rule, or another hit for
          # the winning category can appear in any later message.
        end

        # high-confidence hits decide the category; the raw tally breaks a draw
        # and also carries the decision when nothing reached critical. a final
        # tie resolves to whichever category crs flagged first, which is its
        # more specific match.
        unless category_order.empty?
          winner = category_order.max_by { |name| [category_strong[name], category_hits[name], -category_order.index(name)] }
          attack_type = winner
          mitre = category_tactics[winner] || []
        end

        event.set("[attack_classification][severity]", severity)
        event.set("[attack_classification][honeytrap_rule_id]", rule_id)
        
        # check if the triggered rule belongs to the honeytrap plugin.
        # all honeytrap rules are in the official 9500000-9999999 range.
        rule_id_int = rule_id.to_i
        honeytrap_triggered = (rule_id_int >= 9500000 && rule_id_int <= 9999999)
        event.set("[attack_classification][honeytrap_triggered]", honeytrap_triggered)
        
        event.set("[attack_classification][type]", attack_type)
        if cve
          event.set("[attack_classification][cve_triggered]", cve)
        end
        event.set("mitre_attack", mitre)
      end

      resp_headers = event.get("[modsec][response][headers]") || {}
      cookie = resp_headers["Set-Cookie"] || ""
      event.set("[response][honeytoken_triggered]", cookie.include?("Admin="))
    '
  }
  
  mutate {
    add_field => {
      "[feed_metadata][export_timestamp]" => "%{@timestamp}"
      "[feed_metadata][batch_id]" => "pending_export"
    }
  }

  } else if [modsec][event_type] == "persona_rotation" {
    mutate {
      rename => {
        "[modsec][event_type]" => "event_type"
        "[modsec][event_envelope]" => "event_envelope"
        "[modsec][persona_rotation]" => "persona_rotation"
      }
    }
  }

  mutate {
    remove_field => ["modsec"]
  }
}

output {
  elasticsearch {
    hosts => "elasticsearch:9200"
    manage_template => false
    index => "honeypot-attacks-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}